<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-Pop Empire Manager - Hardcore Edition</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        kpop: {
                            pink: '#ff2a85',
                            purple: '#9d4edf',
                            cyan: '#00f5d4',
                            dark: '#0f0a1e',
                            card: '#1a1429'
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass { background: rgba(26, 20, 41, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 42, 133, 0.18); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(15, 10, 30, 0.6); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #ff2a85; border-radius: 4px; }
    </style>
</head>
<body class="h-full flex flex-col overflow-hidden custom-scrollbar" x-data="kpopGame()" x-init="initGame()">

    <!-- BARRA SUPERIOR -->
    <header class="glass z-30 px-6 py-3 flex items-center justify-between border-b border-pink-500/20 shrink-0">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-kpop-pink to-kpop-purple flex items-center justify-center font-extrabold text-white shadow-lg shadow-pink-500/30 text-xl">K</div>
            <div class="flex items-center gap-2">
                <template x-if="!editingCompanyName">
                    <div class="flex items-center gap-2">
                        <h1 class="font-bold text-lg leading-none bg-gradient-to-r from-pink-400 via-purple-300 to-cyan-300 bg-clip-text text-transparent" x-text="companyName"></h1>
                        <button @click="editingCompanyName = true" class="text-slate-400 hover:text-pink-400 transition"><i data-lucide="edit-3" class="w-3.5 h-3.5"></i></button>
                    </div>
                </template>
                <template x-if="editingCompanyName">
                    <div class="flex items-center gap-2">
                        <input type="text" x-model="tempCompanyName" @keyup.enter="saveCompanyName()" class="bg-slate-900 border border-pink-500 rounded px-2 py-0.5 text-xs text-white focus:outline-none">
                        <button @click="saveCompanyName()" class="text-emerald-400 text-xs font-bold px-2 py-0.5 bg-emerald-950/60 rounded border border-emerald-500/40">Salvar</button>
                    </div>
                </template>
            </div>
        </div>

        <div class="flex items-center gap-3 md:gap-6 text-xs md:text-sm">
            <div class="flex items-center gap-2 bg-slate-900/80 px-3 py-1.5 rounded-lg border border-emerald-500/30">
                <i data-lucide="dollar-sign" class="w-4 h-4 text-emerald-400"></i>
                <div>
                    <span class="text-slate-400 text-[10px] block leading-none">CAIXA DA EMPRESA</span>
                    <span class="font-bold" :class="budget < 20000 ? 'text-red-400 animate-pulse' : 'text-emerald-400'" x-text="formatMoney(budget)"></span>
                </div>
            </div>

            <div class="flex items-center gap-2 bg-slate-900/80 px-3 py-1.5 rounded-lg border border-purple-500/30">
                <i data-lucide="award" class="w-4 h-4 text-purple-400"></i>
                <div>
                    <span class="text-slate-400 text-[10px] block leading-none">REPUTAÇÃO</span>
                    <span class="font-bold text-purple-300" x-text="reputation + '/100'"></span>
                </div>
            </div>

            <div class="flex items-center gap-3 bg-slate-900/90 px-4 py-1.5 rounded-lg border border-cyan-500/30">
                <div>
                    <span class="text-slate-400 text-[10px] block leading-none">DATA</span>
                    <span class="font-bold text-cyan-300" x-text="'Mês ' + currentMonth + ' (' + currentYear + ')'"></span>
                </div>
                <button @click="nextMonth()" class="bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-600 hover:to-purple-700 text-white font-semibold text-xs px-3 py-1.5 rounded-md shadow-md transition flex items-center gap-1 active:scale-95">
                    <span>Avançar Mês</span>
                    <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
                </button>
            </div>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <!-- SIDEBAR -->
        <aside class="w-64 glass border-r border-pink-500/20 flex flex-col justify-between shrink-0">
            <nav class="p-4 space-y-1.5 overflow-y-auto custom-scrollbar">
                <button @click="activeTab = 'dashboard'" :class="activeTab === 'dashboard' ? 'bg-gradient-to-r from-pink-500/20 to-purple-500/20 text-pink-400 border-pink-500/50' : 'text-slate-400 hover:bg-slate-800/50 border-transparent'" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl border text-sm font-medium transition">
                    <i data-lucide="layout-dashboard" class="w-4 h-4"></i><span>Dashboard</span>
                </button>

                <button @click="activeTab = 'roster'" :class="activeTab === 'roster' ? 'bg-gradient-to-r from-pink-500/20 to-purple-500/20 text-pink-400 border-pink-500/50' : 'text-slate-400 hover:bg-slate-800/50 border-transparent'" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl border text-sm font-medium transition">
                    <i data-lucide="users" class="w-4 h-4"></i><span>Elenco & Idols</span>
                    <span class="ml-auto text-xs px-2 py-0.5 rounded-full bg-slate-800 text-pink-400" x-text="idols.length"></span>
                </button>

                <button @click="activeTab = 'scout'" :class="activeTab === 'scout' ? 'bg-gradient-to-r from-pink-500/20 to-purple-500/20 text-pink-400 border-pink-500/50' : 'text-slate-400 hover:bg-slate-800/50 border-transparent'" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl border text-sm font-medium transition">
                    <i data-lucide="user-plus" class="w-4 h-4"></i><span>Audições</span>
                </button>

                <button @click="activeTab = 'styling'" :class="activeTab === 'styling' ? 'bg-gradient-to-r from-pink-500/20 to-purple-500/20 text-pink-400 border-pink-500/50' : 'text-slate-400 hover:bg-slate-800/50 border-transparent'" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl border text-sm font-medium transition">
                    <i data-lucide="scissors" class="w-4 h-4"></i><span>Salão & Styling SVG</span>
                </button>

                <button @click="activeTab = 'groups'" :class="activeTab === 'groups' ? 'bg-gradient-to-r from-pink-500/20 to-purple-500/20 text-pink-400 border-pink-500/50' : 'text-slate-400 hover:bg-slate-800/50 border-transparent'" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl border text-sm font-medium transition">
                    <i data-lucide="sparkles" class="w-4 h-4"></i><span>Grupos & Galeria</span>
                    <span class="ml-auto text-xs px-2 py-0.5 rounded-full bg-slate-800 text-purple-400" x-text="groups.length"></span>
                </button>

                <button @click="activeTab = 'comeback'" :class="activeTab === 'comeback' ? 'bg-gradient-to-r from-pink-500/20 to-purple-500/20 text-pink-400 border-pink-500/50' : 'text-slate-400 hover:bg-slate-800/50 border-transparent'" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl border text-sm font-medium transition">
                    <i data-lucide="disc" class="w-4 h-4"></i><span>Lançar Comeback</span>
                </button>

                <button @click="activeTab = 'tours'" :class="activeTab === 'tours' ? 'bg-gradient-to-r from-pink-500/20 to-purple-500/20 text-pink-400 border-pink-500/50' : 'text-slate-400 hover:bg-slate-800/50 border-transparent'" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl border text-sm font-medium transition">
                    <i data-lucide="globe" class="w-4 h-4"></i><span>Turnês Globais</span>
                </button>

                <button @click="activeTab = 'pr'" :class="activeTab === 'pr' ? 'bg-gradient-to-r from-pink-500/20 to-purple-500/20 text-pink-400 border-pink-500/50' : 'text-slate-400 hover:bg-slate-800/50 border-transparent'" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl border text-sm font-medium transition relative">
                    <i data-lucide="shield-alert" class="w-4 h-4"></i><span>Crises & PR</span>
                    <template x-if="activeCrises.length > 0">
                        <span class="ml-auto w-2 h-2 rounded-full bg-red-500 animate-ping"></span>
                    </template>
                </button>

                <button @click="activeTab = 'social'" :class="activeTab === 'social' ? 'bg-gradient-to-r from-pink-500/20 to-purple-500/20 text-pink-400 border-pink-500/50' : 'text-slate-400 hover:bg-slate-800/50 border-transparent'" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl border text-sm font-medium transition">
                    <i data-lucide="twitter" class="w-4 h-4"></i><span>X (Twitter) Feed</span>
                </button>
            </nav>

            <div class="p-4 m-3 glass rounded-xl text-xs space-y-2 border border-slate-700/50">
                <div class="flex items-center gap-2 text-pink-400 font-semibold">
                    <i data-lucide="bell" class="w-3.5 h-3.5"></i><span>Última Notícia</span>
                </div>
                <p class="text-slate-300 text-[11px] leading-relaxed" x-text="recentNews"></p>
            </div>
        </aside>
        <!-- CONTEÚDO PRINCIPAL -->
        <main class="flex-1 overflow-y-auto p-6 custom-scrollbar bg-slate-950/60">

            <!-- MODAL DE REUNIÃO DE IDOL (1-ON-1) -->
            <template x-if="activeMeeting">
                <div class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
                    <div class="glass max-w-lg w-full p-6 rounded-2xl border border-pink-500/40 space-y-4">
                        <div class="flex items-center gap-4">
                            <div class="w-16 h-16 rounded-xl overflow-hidden bg-slate-900 border border-pink-500/30 shrink-0" x-html="renderIdolSvg(activeMeeting.idol)"></div>
                            <div>
                                <span class="text-xs text-pink-400 font-semibold uppercase">Reunião Particular</span>
                                <h3 class="text-xl font-bold text-white" x-text="activeMeeting.idol.stageName + ' pediu uma conversa'"></h3>
                            </div>
                        </div>
                        <p class="text-sm text-slate-200 bg-slate-900/80 p-4 rounded-xl border border-slate-800 italic" x-text="'“' + activeMeeting.requestText + '”'"></p>
                        <div class="space-y-2 pt-2">
                            <button @click="resolveMeeting(true)" class="w-full p-3 bg-emerald-600/20 hover:bg-emerald-600/30 border border-emerald-500/40 rounded-xl text-left flex justify-between items-center transition">
                                <div><p class="font-bold text-emerald-400 text-xs">Aceitar Pedido</p><p class="text-[11px] text-slate-400" x-text="activeMeeting.acceptImpactText"></p></div>
                                <i data-lucide="check-circle" class="w-5 h-5 text-emerald-400"></i>
                            </button>
                            <button @click="resolveMeeting(false)" class="w-full p-3 bg-red-600/20 hover:bg-red-600/30 border border-red-500/40 rounded-xl text-left flex justify-between items-center transition">
                                <div><p class="font-bold text-red-400 text-xs">Recusar Pedido</p><p class="text-[11px] text-slate-400" x-text="activeMeeting.denyImpactText"></p></div>
                                <i data-lucide="x-circle" class="w-5 h-5 text-red-400"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </template>

            <!-- TAB 1: DASHBOARD -->
            <template x-if="activeTab === 'dashboard'">
                <div class="space-y-6">
                    <div>
                        <h2 class="text-2xl font-bold text-white">Painel da Empresa</h2>
                        <p class="text-slate-400 text-sm">Resumo da agência e métricas globais acumuladas.</p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <div class="glass p-4 rounded-xl border-l-4 border-l-emerald-500 space-y-1">
                            <span class="text-xs text-slate-400">Caixa Atual</span>
                            <div class="text-2xl font-black text-emerald-400" x-text="formatMoney(budget)"></div>
                            <p class="text-[11px] text-slate-400">Custos fixos: <span class="text-red-400" x-text="formatMoney(monthlyExpenses)"></span>/mês</p>
                        </div>

                        <div class="glass p-4 rounded-xl border-l-4 border-l-purple-500 space-y-1">
                            <span class="text-xs text-slate-400">Reputação na Indústria</span>
                            <div class="text-2xl font-black text-purple-400" x-text="reputation + ' / 100'"></div>
                            <p class="text-[11px] text-slate-400">Impacta contratos e propostas</p>
                        </div>

                        <div class="glass p-4 rounded-xl border-l-4 border-l-pink-500 space-y-1">
                            <span class="text-xs text-slate-400">Talentos Totais</span>
                            <div class="text-2xl font-black text-pink-400" x-text="idols.length"></div>
                            <p class="text-[11px] text-slate-400" x-text="groups.length + ' Grupos formados'"></p>
                        </div>

                        <div class="glass p-4 rounded-xl border-l-4 border-l-cyan-500 space-y-1">
                            <span class="text-xs text-slate-400">Total de Álbuns Vendidos (Empresa)</span>
                            <div class="text-2xl font-black text-cyan-400" x-text="totalAlbumSales.toLocaleString() + ' cópias'"></div>
                            <p class="text-[11px] text-slate-400">Soma de todas as eras da agência</p>
                        </div>
                    </div>
                </div>
            </template>

            <!-- TAB 5: GROUPS & GALERIA DE WINS -->
            <template x-if="activeTab === 'groups'">
                <div class="space-y-6">
                    <div>
                        <h2 class="text-2xl font-bold text-white">Grupos & Galeria de Vitórias</h2>
                        <p class="text-slate-400 text-sm">Acompanhe as vendas individuais e os troféus de Music Shows conquistados por CADA GRUPO.</p>
                    </div>

                    <div class="glass p-6 rounded-2xl border border-purple-500/30 space-y-4">
                        <h3 class="font-bold text-lg text-white">Criar Novo Grupo</h3>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div>
                                <label class="block text-xs text-slate-400 mb-1">Nome do Grupo</label>
                                <input type="text" x-model="newGroupName" placeholder="Ex: AESPA, BTS..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
                            </div>
                            <div>
                                <label class="block text-xs text-slate-400 mb-1">Nome do Fandom Oficial</label>
                                <input type="text" x-model="newGroupFandom" placeholder="Ex: MY, ARMY, BLINK..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
                            </div>
                            <div>
                                <label class="block text-xs text-slate-400 mb-1">Conceito</label>
                                <select x-model="newGroupConcept" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
                                    <option value="Girl Crush / Dark">Girl Crush / Dark</option>
                                    <option value="Teen Fresh / Fofo">Teen Fresh / Fofo</option>
                                    <option value="Retro / Synthwave">Retro / Synthwave</option>
                                    <option value="Hip-Hop / Swag">Hip-Hop / Swag</option>
                                </select>
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs text-slate-400 mb-2">Selecione os Membros:</label>
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                                <template x-for="idol in idols" :key="idol.id">
                                    <label class="flex items-center gap-3 p-3 rounded-xl glass border border-slate-800 cursor-pointer">
                                        <input type="checkbox" :value="idol.id" x-model="selectedIdolsForGroup" class="accent-pink-500">
                                        <div class="w-8 h-8 rounded-lg overflow-hidden bg-slate-900 shrink-0" x-html="renderIdolSvg(idol)"></div>
                                        <div class="text-xs">
                                            <p class="font-bold text-white" x-text="idol.stageName"></p>
                                            <p class="text-[10px] text-slate-400" x-text="idol.gender"></p>
                                        </div>
                                    </label>
                                </template>
                            </div>
                        </div>

                        <button @click="createGroup()" class="px-6 py-2.5 bg-gradient-to-r from-pink-500 to-purple-600 text-white font-semibold rounded-xl text-xs">
                            Realizar Debut Oficial
                        </button>
                    </div>

                    <!-- CARTÕES DE GRUPO COM CONTABILIZAÇÃO EXCLUSIVA DE WINS E VENDAS -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <template x-for="group in groups" :key="group.id">
                            <div class="glass p-5 rounded-2xl border border-slate-700 space-y-4">
                                <div class="flex justify-between items-start">
                                    <div>
                                        <h4 class="font-bold text-xl text-white" x-text="group.name"></h4>
                                        <p class="text-xs text-pink-400 font-semibold" x-text="'Fandom: ' + group.fandomName"></p>
                                    </div>
                                    <div class="text-right">
                                        <span class="text-xs font-bold text-amber-400 bg-amber-500/10 px-2.5 py-1 rounded-full border border-amber-500/30 flex items-center gap-1">
                                            🏆 <span x-text="group.wins + ' Wins do Grupo'"></span>
                                        </span>
                                    </div>
                                </div>

                                <div class="grid grid-cols-2 gap-2 text-xs bg-slate-900/70 p-3 rounded-xl border border-slate-800">
                                    <div>
                                        <span class="text-slate-400 text-[10px] block">Álbums Vendidos (Grupo)</span>
                                        <span class="font-bold text-cyan-300" x-text="group.totalSales.toLocaleString() + ' cópias'"></span>
                                    </div>
                                    <div>
                                        <span class="text-slate-400 text-[10px] block">Tamanho do Fandom</span>
                                        <span class="font-bold text-pink-300" x-text="group.fandomSize.toLocaleString() + ' fãs'"></span>
                                    </div>
                                </div>

                                <div>
                                    <span class="text-xs text-slate-400 block mb-1">Membros do Grupo:</span>
                                    <div class="flex flex-wrap gap-2">
                                        <template x-for="memberId in group.members" :key="memberId">
                                            <div class="flex items-center gap-2 px-2.5 py-1 rounded-lg bg-slate-900 border border-slate-700 text-xs text-slate-200">
                                                <div class="w-5 h-5 rounded-full overflow-hidden bg-slate-950" x-html="getIdolAvatarSvg(memberId)"></div>
                                                <span x-text="getIdolName(memberId)"></span>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </template>

            <!-- TAB 6: COMEBACK HARDCORE -->
            <template x-if="activeTab === 'comeback'">
                <div class="space-y-6">
                    <div>
                        <h2 class="text-2xl font-bold text-white">Planejar Comeback & Álbum</h2>
                        <p class="text-slate-400 text-sm">Produza o comeback e dispute charts contra grupos rivais da indústria.</p>
                    </div>

                    <div class="glass p-6 rounded-2xl border border-pink-500/30 space-y-6">
                        <div>
                            <label class="block text-xs font-semibold text-slate-300 mb-2">1. Escolha o Grupo</label>
                            <select x-model="cbSelectedGroup" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-sm text-white">
                                <option value="">-- Selecione o Grupo --</option>
                                <template x-for="g in groups" :key="g.id">
                                    <option :value="g.id" x-text="g.name + ' (' + g.fandomName + ')'"></option>
                                </template>
                            </select>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-300 mb-2">Título da Música</label>
                                <input type="text" x-model="cbAlbumTitle" placeholder="Ex: Supernova, Drama..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-300 mb-2">Distribuição de Linhas no MV</label>
                                <select x-model="cbLineDistribution" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
                                    <option value="balanced">Equilibrada (Fandom em Paz)</option>
                                    <option value="main_vocal">Foco no Main Vocal (Melhor Nota Vocal)</option>
                                    <option value="center">Foco no Center / Visual (Risco de fúria dos Akgaes)</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-300 mb-2">Verba do MV</label>
                                <select x-model="cbMvBudget" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
                                    <option value="low">Estúdio Simples ($15.000)</option>
                                    <option value="medium">Cenários Reais & Efeitos ($45.000)</option>
                                    <option value="high">Superprodução Blockbuster ($120.000)</option>
                                </select>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-300 mb-2">Estilo de Canto ao Vivo</label>
                                <select x-model="cbSingingStyle" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
                                    <option value="live">100% Ao Vivo (Alta Estabilidade = Respeito Geral; Baixa = Desafinação Viral)</option>
                                    <option value="mr">Base Vocal / MR (Equilibrado)</option>
                                    <option value="playback">100% Playback (Risco de Hate e acusações no Twitter)</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-300 mb-2">Qualidade do Produtor Musical</label>
                                <select x-model="cbMusicQuality" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
                                    <option value="low">Indie ($10.000)</option>
                                    <option value="medium">Produtor Consagrado ($35.000)</option>
                                    <option value="high">Hitmaker Internacional ($80.000)</option>
                                </select>
                            </div>
                        </div>

                        <div class="flex items-center gap-3 glass p-4 rounded-xl border border-amber-500/30">
                            <input type="checkbox" x-model="cbHasRapSection" id="rapCheck" class="w-4 h-4 accent-amber-500">
                            <label for="rapCheck" class="text-xs text-slate-200 cursor-pointer">
                                <span class="font-bold text-amber-400 block">Incluir Seção de Rap na Música Solo</span>
                                <span class="text-[11px] text-slate-400">Atributo de Rap só influenciará a nota técnica se esta opção for marcada.</span>
                            </label>
                        </div>

                        <button @click="launchComeback()" class="w-full py-3 bg-gradient-to-r from-pink-500 via-purple-600 to-cyan-500 text-white font-bold rounded-xl shadow-lg">
                            Lançar Comeback e Competir nos Charts! 🚀
                        </button>
                    </div>

                    <!-- SIMULAÇÃO SEMANAL DE CHARTS COM CONCORRENTES RIVAIS -->
                    <template x-if="activeComebackEra">
                        <div class="glass p-6 rounded-2xl border border-cyan-500/40 space-y-6">
                            <div class="flex justify-between items-center border-b border-slate-800 pb-4">
                                <div>
                                    <h3 class="font-bold text-xl text-white" x-text="'Promovendo: ' + activeComebackEra.title + ' (' + activeComebackEra.group.name + ')'"></h3>
                                    <p class="text-xs text-cyan-400" x-text="'Semana ' + activeComebackEra.currentWeek + ' de 4'"></p>
                                </div>
                                <div class="text-right">
                                    <span class="text-xs text-slate-400 block">Vendas Nesta Semana</span>
                                    <span class="text-lg font-black text-emerald-400" x-text="activeComebackEra.weeklySales.toLocaleString() + ' cópias'"></span>
                                </div>
                            </div>

                            <!-- APURAÇÃO CONTRA GRUPO RIVAL -->
                            <div class="glass p-4 rounded-xl border border-purple-500/30 bg-purple-950/20 space-y-2">
                                <div class="flex justify-between items-center">
                                    <h4 class="font-bold text-sm text-purple-300 flex items-center gap-2">
                                        <i data-lucide="tv" class="w-4 h-4"></i>
                                        Disputa de Music Show (M Countdown / Inkigayo)
                                    </h4>
                                    <span class="text-xs font-bold px-2 py-0.5 rounded" :class="activeComebackEra.lastWin ? 'bg-amber-500/20 text-amber-400 border border-amber-500/40' : 'bg-slate-800 text-slate-400'" x-text="activeComebackEra.lastWin ? '🏆 1ST WIN DO GRUPO CONQUISTADO!' : 'Em Disputa'"></span>
                                </div>
                                <p class="text-xs text-slate-300" x-text="activeComebackEra.rivalInfo"></p>
                                <p class="text-xs font-semibold text-cyan-300" x-text="activeComebackEra.musicShowStatus"></p>
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                                <button @click="buyPromoAction('tiktok')" class="p-3 bg-slate-900 hover:bg-slate-800 rounded-xl border border-slate-700 text-left space-y-1">
                                    <p class="font-bold text-xs text-pink-400">Desafio TikTok / Reels ($3.000)</p>
                                    <p class="text-[10px] text-slate-400">+Vendas Digitais.</p>
                                </button>
                                <button @click="buyPromoAction('food')" class="p-3 bg-slate-900 hover:bg-slate-800 rounded-xl border border-slate-700 text-left space-y-1">
                                    <p class="font-bold text-xs text-purple-400">Mimos para Fãs ($8.000)</p>
                                    <p class="text-[10px] text-slate-400">+Votos no Music Show.</p>
                                </button>
                                <button @click="buyPromoAction('gangnam')" class="p-3 bg-slate-900 hover:bg-slate-800 rounded-xl border border-slate-700 text-left space-y-1">
                                    <p class="font-bold text-xs text-cyan-400">Outdoors em Gangnam ($25.000)</p>
                                    <p class="text-[10px] text-slate-400">+Vendas Físicas.</p>
                                </button>
                            </div>

                            <button @click="advancePromoWeek()" class="w-full py-3 bg-gradient-to-r from-cyan-500 to-purple-600 font-bold text-white rounded-xl text-xs">
                                Avançar Semana do Comeback →
                            </button>
                        </div>
                    </template>
                </div>
            </template>

            <!-- TAB 8: CRISES DE PR & PROTESTOS DE FÃS -->
            <template x-if="activeTab === 'pr'">
                <div class="space-y-6">
                    <div>
                        <h2 class="text-2xl font-bold text-white">Crises de Relações Públicas & Protestos</h2>
                        <p class="text-slate-400 text-sm">Gerencie escândalos de Dispatch, fofocas e protestos de Akgaes na porta da empresa.</p>
                    </div>

                    <div class="space-y-4">
                        <template x-for="crisis in activeCrises" :key="crisis.id">
                            <div class="glass p-6 rounded-2xl border border-red-500/40 bg-red-950/10 space-y-4">
                                <h3 class="font-bold text-lg text-white" x-text="crisis.title"></h3>
                                <p class="text-sm text-slate-300" x-text="crisis.description"></p>
                                <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                                    <template x-for="option in crisis.options" :key="option.text">
                                        <button @click="resolveCrisis(crisis, option)" class="p-3 bg-slate-900 border border-slate-700 rounded-xl text-left hover:border-pink-500 transition">
                                            <p class="text-xs font-bold text-pink-400" x-text="option.text"></p>
                                            <p class="text-[10px] text-slate-400" x-text="option.impactText"></p>
                                        </button>
                                    </template>
                                </div>
                            </div>
                        </template>
                        <template x-if="activeCrises.length === 0">
                            <div class="py-12 text-center glass rounded-2xl text-slate-500">
                                <h3 class="text-white font-bold text-base">Tudo calmo na assessoria de imprensa</h3>
                                <p class="text-xs text-slate-400 mt-1">Nenhum escândalo ativo no momento.</p>
                            </div>
                        </template>
                    </div>
                </div>
            </template>

            <!-- TAB 9: X (TWITTER) REATIVO -->
            <template x-if="activeTab === 'social'">
                <div class="space-y-6">
                    <div>
                        <h2 class="text-2xl font-bold text-white flex items-center gap-2">
                            <i data-lucide="twitter" class="w-6 h-6 text-cyan-400"></i>
                            X (Twitter) Feed em Tempo Real
                        </h2>
                        <p class="text-slate-400 text-sm">Acompanhe opiniões do público geral, posts de K-Media, reações de haters e contas de Akgaes.</p>
                    </div>

                    <div class="glass rounded-2xl p-4 max-w-2xl mx-auto space-y-3">
                        <template x-for="post in socialPosts" :key="post.id">
                            <div class="p-4 rounded-xl bg-slate-900/80 border border-slate-800 space-y-2">
                                <div class="flex justify-between items-center text-xs">
                                    <div class="flex items-center gap-2">
                                        <span class="font-bold text-pink-400" x-text="post.handle"></span>
                                        <span class="text-slate-500" x-text="post.time"></span>
                                    </div>
                                    <span class="text-[10px] px-2 py-0.5 rounded bg-slate-800 text-slate-400" x-text="post.tag"></span>
                                </div>
                                <p class="text-sm text-slate-200" x-text="post.content"></p>
                            </div>
                        </template>
                    </div>
                </div>
            </template>

        </main>
    </div>
    <!-- LÓGICA DE JOGO HARDCORE -->
    <script>
        function kpopGame() {
            return {
                companyName: "HYBE Lite Ent.",
                editingCompanyName: false,
                tempCompanyName: "",
                budget: 180000,
                reputation: 50,
                currentMonth: 1,
                currentYear: 2026,
                activeTab: 'dashboard',

                selectedStylingIdol: null,
                activeMeeting: null,
                activeComebackEra: null,

                totalAlbumSales: 0,
                monthlyExpenses: 12000,
                recentNews: "Agência fundada! Monte grupos, gerencie talentos e evite a falência.",

                idols: [
                    { id: 1, stageName: "Minho", gender: "Masculino", age: 19, vocal: 78, dance: 85, rap: 70, stability: 80, charisma: 75, stress: 15, status: "Debutado", soloFandom: 5400, skinTone: "#fcd5ce", hairStyle: "short_kpop", hairColor: "#9d4edf" },
                    { id: 2, stageName: "Jennie", gender: "Feminino", age: 18, vocal: 88, dance: 72, rap: 82, stability: 85, charisma: 90, stress: 10, status: "Debutado", soloFandom: 8900, skinTone: "#f8d7da", hairStyle: "long_straight", hairColor: "#ff2a85" }
                ],

                // GRUPOS POSSUEM CONTABILIZAÇÃO PRÓPRIA DE WINS E VENDAS
                groups: [
                    { id: 101, name: "NEO NOVA", fandomName: "NOVAs", concept: "Girl Crush / Dark", members: [1, 2], fandomSize: 15000, wins: 0, totalSales: 0 }
                ],

                scoutCandidates: [],
                activeCrises: [],
                socialPosts: [
                    { id: 1, handle: "@KNetzTalk", time: "Há 1h", tag: "#KpopManager", content: "Nova agência musical inicia suas atividades em Seul. Será que aguentam a pressão da indústria?" }
                ],

                // Comeback Form
                cbSelectedGroup: "",
                cbAlbumTitle: "",
                cbLineDistribution: "balanced",
                cbMvBudget: "medium",
                cbSingingStyle: "mr",
                cbMusicQuality: "medium",
                cbHasRapSection: true,

                newGroupName: "",
                newGroupFandom: "",
                newGroupConcept: "Girl Crush / Dark",
                selectedIdolsForGroup: [],

                initGame() {
                    this.tempCompanyName = this.companyName;
                    this.generateScoutCandidates();
                    this.refreshLucide();
                },

                saveCompanyName() {
                    if (this.tempCompanyName.trim()) {
                        this.companyName = this.tempCompanyName.trim();
                    }
                    this.editingCompanyName = false;
                },

                refreshLucide() {
                    setTimeout(() => { if (window.lucide) lucide.createIcons(); }, 50);
                },

                formatMoney(amount) {
                    return '$' + amount.toLocaleString('en-US');
                },

                renderIdolSvg(idol) {
                    if (!idol) return '';
                    const skin = idol.skinTone || '#fcd5ce';
                    const hairColor = idol.hairColor || '#9d4edf';
                    const style = idol.hairStyle || 'short_kpop';

                    let hairPath = `<path d="M 20 40 Q 50 10 80 40 Q 80 25 50 18 Q 20 25 20 40 Z" fill="${hairColor}" />`;
                    if (style === 'long_straight') {
                        hairPath = `<path d="M 18 40 Q 50 12 82 40 L 85 85 Q 75 88 72 60 L 72 40 Q 50 22 28 40 L 28 60 Q 25 88 15 85 Z" fill="${hairColor}" />`;
                    }
                    return `
                        <svg viewBox="0 0 100 100" class="w-full h-full">
                            <rect width="100" height="100" fill="#0f172a" />
                            <path d="M 20 100 Q 50 75 80 100 Z" fill="#334155" />
                            <rect x="43" y="58" width="14" height="16" fill="${skin}" rx="3" />
                            <ellipse cx="50" cy="46" rx="24" ry="26" fill="${skin}" />
                            <ellipse cx="40" cy="45" rx="3" ry="4" fill="#0f172a" />
                            <ellipse cx="60" cy="45" rx="3" ry="4" fill="#0f172a" />
                            <path d="M 45 56 Q 50 60 55 56" stroke="#e11d48" stroke-width="2" fill="none" />
                            ${hairPath}
                        </svg>
                    `;
                },

                getIdolAvatarSvg(id) {
                    const idol = this.idols.find(i => i.id === id);
                    return this.renderIdolSvg(idol);
                },

                getIdolName(id) {
                    const idol = this.idols.find(i => i.id === id);
                    return idol ? idol.stageName : 'Membro';
                },

                trainIdol(idol, type) {
                    if (this.budget < 1000) return alert("Sem orçamento!");
                    this.budget -= 1000;
                    idol.stress = Math.min(100, idol.stress + 10);
                    if (type === 'vocal') idol.vocal = Math.min(99, idol.vocal + 2);
                    if (type === 'dance') idol.dance = Math.min(99, idol.dance + 2);
                    if (type === 'rap') idol.rap = Math.min(99, idol.rap + 2);
                },

                restIdol(idol) {
                    idol.stress = Math.max(0, idol.stress - 25);
                },

                runScout(type) {
                    const cost = type === 'local' ? 5000 : 20000;
                    if (this.budget < cost) return alert("Sem orçamento para scouting!");
                    this.budget -= cost;
                    this.generateScoutCandidates(type === 'global');
                },

                generateScoutCandidates(isGlobal = false) {
                    const names = ["Felix", "Hanni", "Kai", "Yuna", "Sunoo", "Chaewon"];
                    const bonus = isGlobal ? 15 : 0;
                    this.scoutCandidates = Array.from({ length: 3 }, (_, i) => ({
                        id: Date.now() + i,
                        stageName: names[Math.floor(Math.random() * names.length)],
                        gender: Math.random() > 0.5 ? "Feminino" : "Masculino",
                        age: 17,
                        vocal: 50 + bonus,
                        dance: 50 + bonus,
                        rap: 45 + bonus,
                        stability: 60 + bonus,
                        charisma: 50 + bonus,
                        stress: 5,
                        status: "Trainee",
                        soloFandom: 500,
                        hairStyle: "short_kpop",
                        hairColor: "#ff2a85",
                        skinTone: "#fcd5ce"
                    }));
                },

                signTrainee(candidate) {
                    this.idols.push(candidate);
                    this.scoutCandidates = this.scoutCandidates.filter(c => c.id !== candidate.id);
                },

                createGroup() {
                    if (!this.newGroupName || this.selectedIdolsForGroup.length === 0) return alert("Preencha o nome e selecione membros!");
                    const group = {
                        id: Date.now(),
                        name: this.newGroupName,
                        fandomName: this.newGroupFandom || "Fans",
                        concept: this.newGroupConcept,
                        members: [...this.selectedIdolsForGroup].map(Number),
                        fandomSize: 2000,
                        wins: 0,
                        totalSales: 0
                    };
                    this.groups.push(group);
                    this.newGroupName = "";
                    this.selectedIdolsForGroup = [];
                    this.activeTab = 'groups';
                },

                launchComeback() {
                    if (!this.cbSelectedGroup || !this.cbAlbumTitle) return alert("Selecione o grupo e informe o título!");
                    const group = this.groups.find(g => g.id == this.cbSelectedGroup);

                    let cost = 0;
                    if (this.cbMusicQuality === 'low') cost += 10000;
                    if (this.cbMusicQuality === 'medium') cost += 35000;
                    if (this.cbMusicQuality === 'high') cost += 80000;

                    if (this.cbMvBudget === 'low') cost += 15000;
                    if (this.cbMvBudget === 'medium') cost += 45000;
                    if (this.cbMvBudget === 'high') cost += 120000;

                    if (this.budget < cost) return alert("Orçamento insuficiente! Custo necessário: " + this.formatMoney(cost));
                    this.budget -= cost;

                    // CÁLCULO DE VENDAS INICIAIS DA ERA
                    const baseSales = Math.floor(Math.random() * 30000) + (cost * 0.7);
                    const initialRevenue = Math.floor(baseSales * 3.5);

                    // ATUALIZAÇÃO DUAL: NO GRUPO E NA EMPRESA
                    group.totalSales += baseSales;
                    this.totalAlbumSales += baseSales;
                    this.budget += initialRevenue;

                    // VERIFICAÇÃO DE PROTESTO DE AKGAES
                    if (this.cbLineDistribution === 'center') {
                        this.activeCrises.push({
                            id: Date.now(),
                            title: "Protesto de Caminhão por Distribuição Injusta de Linhas",
                            description: "Fãs solos (Akgaes) enviaram um caminhão com painel de LED para a porta da agência protestando contra a falta de destaque de seus membros no MV de '" + this.cbAlbumTitle + "'.",
                            options: [
                                { text: "Prometer Versão Dance Practice Focada", impactText: "Estresse do Grupo +10, Fandom Leal Recomposto", action: () => { this.reputation += 2; } },
                                { text: "Ignorar o Protesto", impactText: "Vendas Físicas -10% na próxima semana", action: () => { this.reputation -= 8; } }
                            ]
                        });
                    }

                    // GERAR CONCORRENTE RIVAL DA INDÚSTRIA
                    const rivals = ["Stray Kids (JYP)", "NewJeans (HYBE)", "AESPA (SM)", "IVE (Starship)"];
                    const rivalName = rivals[Math.floor(Math.random() * rivals.length)];

                    this.activeComebackEra = {
                        group: group,
                        title: this.cbAlbumTitle,
                        currentWeek: 1,
                        weeklySales: baseSales,
                        rivalName: rivalName,
                        rivalInfo: "Competindo nesta semana contra o lançamento de: " + rivalName,
                        musicShowStatus: "Calculando pontuação nos charts...",
                        lastWin: false
                    };

                    this.socialPosts.unshift({
                        id: Date.now(),
                        handle: "@BillboardK",
                        time: "Agora mesmo",
                        tag: "#" + group.name,
                        content: "🚨 '" + this.cbAlbumTitle + "' do grupo " + group.name + " estreou nos charts! Disputa acirrada contra " + rivalName + "!",
                    });
                },

                advancePromoWeek() {
                    if (!this.activeComebackEra) return;
                    this.activeComebackEra.currentWeek++;

                    const addedSales = Math.floor(Math.random() * 15000) + 5000;
                    const revenue = addedSales * 3;

                    // ATUALIZAÇÃO RECURSIVA DAS VENDAS
                    this.activeComebackEra.group.totalSales += addedSales;
                    this.totalAlbumSales += addedSales;
                    this.budget += revenue;

                    // DISPUTA CONTRA GRUPO RIVAL
                    const ourScore = (this.activeComebackEra.group.fandomSize * 0.4) + (this.activeComebackEra.weeklySales * 0.6);
                    const rivalScore = Math.floor(Math.random() * 50000) + 20000;

                    if (ourScore > rivalScore) {
                        // O TROFÉU VAI EXCLUSIVAMENTE PARA O GRUPO
                        this.activeComebackEra.group.wins++;
                        this.activeComebackEra.lastWin = true;
                        this.activeComebackEra.musicShowStatus = "🏆 VITÓRIA! O grupo " + this.activeComebackEra.group.name + " venceu o " + this.activeComebackEra.rivalName + " e levou o 1st Win!";

                        this.socialPosts.unshift({
                            id: Date.now(),
                            handle: "@KpopMusicShow",
                            time: "Agora",
                            tag: "#" + this.activeComebackEra.group.name + "1stWin",
                            content: "🎉 TROFÉU! " + this.activeComebackEra.group.name + " venceu a disputa contra " + this.activeComebackEra.rivalName + "! O troféu do grupo foi contabilizado!"
                        });
                    } else {
                        this.activeComebackEra.lastWin = false;
                        this.activeComebackEra.musicShowStatus = "Perderam o troféu desta semana para o " + this.activeComebackEra.rivalName + ". Impulsione as promoções!";
                    }

                    if (this.activeComebackEra.currentWeek > 4) {
                        alert("Era de divulgações de '" + this.activeComebackEra.title + "' finalizada!");
                        this.activeComebackEra = null;
                    }
                },

                buyPromoAction(type) {
                    if (!this.activeComebackEra) return;
                    if (type === 'tiktok' && this.budget >= 3000) {
                        this.budget -= 3000;
                        this.activeComebackEra.weeklySales += 5000;
                        this.activeComebackEra.group.totalSales += 5000;
                        this.totalAlbumSales += 5000;
                    }
                    if (type === 'food' && this.budget >= 8000) {
                        this.budget -= 8000;
                        this.activeComebackEra.weeklySales += 10000;
                        this.activeComebackEra.group.totalSales += 10000;
                        this.totalAlbumSales += 10000;
                    }
                    if (type === 'gangnam' && this.budget >= 25000) {
                        this.budget -= 25000;
                        this.activeComebackEra.weeklySales += 30000;
                        this.activeComebackEra.group.totalSales += 30000;
                        this.totalAlbumSales += 35000;
                    }
                },

                startTour(type) {
                    let cost = type === 'local' ? 20000 : (type === 'asia' ? 60000 : 150000);
                    if (this.budget < cost) return alert("Sem orçamento para esta turnê!");
                    this.budget -= cost;
                    const profit = cost * 2.2;
                    this.budget += profit;
                    alert("Turnê finalizada! Lucro gerado: " + this.formatMoney(profit - cost));
                },

                nextMonth() {
                    this.currentMonth++;
                    if (this.currentMonth > 12) {
                        this.currentMonth = 1;
                        this.currentYear++;
                    }

                    // COBRANÇA RIGOROSA DE DESPESAS DA EMPRESA
                    this.budget -= this.monthlyExpenses;

                    // VERIFICAÇÃO DE RISCO DE FALÊNCIA
                    if (this.budget < 0) {
                        alert("⚠️ ATENÇÃO: A EMPRESA ENTROU EM CAIXA NEGATIVO! Se não recuperar o saldo no próximo mês, sofrerá falência.");
                    }

                    this.refreshLucide();
                },

                resolveCrisis(crisis, option) {
                    option.action();
                    this.activeCrises = this.activeCrises.filter(c => c.id !== crisis.id);
                }
            };
        }
    </script>
</body>
</html>
